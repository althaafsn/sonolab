[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sonolab_pipe2d_fdtd"
version = "0.1.0"
description = "Fast Lab A FDTD sector-scan engine for SonoLab pipe2d"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sonolab_pipe2d_fdtd"
